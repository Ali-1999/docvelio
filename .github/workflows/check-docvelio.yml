name: Docvelio tool build check
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check public/assets/extra-tools.js
          node --check public/assets/improvements.js
          node --check public/assets/social-sharing.js
          node --check scripts/extend-toolkit.cjs
          node --check scripts/blog-data-en.cjs
          node --check scripts/blog-data-locales-a.cjs
          node --check scripts/blog-data-locales-b.cjs
          node --check scripts/build-blogs.cjs
          node --check scripts/build-docvelio.cjs
          node --check scripts/site-shell.cjs
          node --check scripts/page-content.cjs
          node --check public/assets/design-system.js
          node --check public/assets/cookie-consent.js
          node --check public/assets/site.js
          node --check scripts/apply-design.cjs
          node --check scripts/seo-audit-fixes.cjs
          node --check scripts/add-image-studio.cjs
          node --check scripts/image-seo-topics.cjs
          node --check scripts/image-seo-locales.cjs
          node --check scripts/image-seo-pages.cjs
          node --check scripts/cargo-content-en.cjs
          node --check scripts/cargo-locales.cjs
          node --check scripts/build-cargo-tools.cjs
          node --check scripts/test-cargo.cjs
          node --check scripts/check-live-indexing.cjs
          node --check scripts/test-indexability.cjs
          node --check scripts/seo-growth.cjs
          node --check scripts/audit-seo-final.cjs
          node --check scripts/add-search-answers.cjs
          node --check scripts/audit-seo.cjs
          node --check scripts/test-final-seo.cjs
          node --check scripts/compare-sitemap-semantic.cjs
          node --check scripts/build-wheel-picker.cjs
          node --check scripts/final-global-shell.cjs
          node --check scripts/optimize-site.cjs
          node --check public/assets/cargo-core.js
          node --check public/assets/cargo-calculator.js
          node --check scripts/test-image-seo.cjs
          node --check scripts/test-image-studio.cjs
          node --check public/assets/image-core.js
          node --check public/assets/image-studio.js
          node --check scripts/test-code128.cjs
          node --check public/assets/barcode-code128.js
          node --check scripts/test-barcode-retail.cjs
          node --check public/assets/barcode-retail.js
          node --check scripts/test-docvelio.cjs
          node --check scripts/test-ui.cjs
          node --check scripts/test-consent.cjs
          node --check public/assets/docvelio-ga4.js
          node --check scripts/install-ga4.cjs
          node --check scripts/test-ga4.cjs
          node --check scripts/install-tiktok-tool.cjs
          node --check scripts/test-tiktok-tool.cjs
          node --check src/excel-formula-worker.js
          python3 -m py_compile tiktok-backend/app.py
          node --check scripts/audit-adsense-site-quality.cjs
          node --check scripts/check-adsense-readiness.cjs
          node --check scripts/refresh-guide-descriptions.cjs
          node --check scripts/test-guide-descriptions.cjs
      - name: Verify committed sitemap before build
        run: python3 scripts/verify-sitemap.py --source-only
      - name: Generate the website
        run: |
          node scripts/extend-toolkit.cjs
          node scripts/build-blogs.cjs
          node scripts/build-docvelio.cjs
          node scripts/site-shell.cjs
          node scripts/page-content.cjs
          node scripts/apply-design.cjs
          node scripts/seo-audit-fixes.cjs
          node scripts/add-image-studio.cjs
          node scripts/image-seo-pages.cjs
          node scripts/build-cargo-tools.cjs
      - name: Ensure sitemap in Git matches generated output
        run: node scripts/compare-sitemap-semantic.cjs
      - name: Check localized tools and indexing metadata
        run: |
          node scripts/test-code128.cjs
          node scripts/test-barcode-retail.cjs
          node scripts/test-docvelio.cjs
          node scripts/test-ui.cjs
          node scripts/test-consent.cjs
          node scripts/test-image-studio.cjs
          node scripts/test-image-seo.cjs
          node scripts/test-cargo.cjs
          node scripts/test-indexability.cjs
          python3 scripts/verify-sitemap.py

      - name: Verify newer wheel route and final responsive global shell
        run: |
          node scripts/ensure-yandex-verification.cjs
          node scripts/build-wheel-picker.cjs
          node scripts/final-global-shell.cjs
          node scripts/optimize-site.cjs
          node scripts/seo-growth.cjs
          node scripts/add-search-answers.cjs
          node scripts/audit-seo-final.cjs
          node scripts/test-final-seo.cjs
          node scripts/audit-seo.cjs
          node scripts/install-ga4.cjs
          node scripts/test-ga4.cjs

      - name: Complete production generation and audit all published pages
        run: |
          node scripts/build-excel-formula.cjs
          node scripts/build-europe-tools.cjs
          node scripts/redesign-home-toolkit.cjs
          node scripts/redesign-full-homepage.cjs
          node scripts/ensure-organization-schema.cjs
          node scripts/fix-ahrefs-metadata.cjs
          node scripts/refresh-guide-descriptions.cjs
          node scripts/test-guide-descriptions.cjs
          node scripts/install-adsense.cjs
          node scripts/implement-internal-links.cjs
          node scripts/install-fazier-badge.cjs
          node scripts/optimize-homepage-css.cjs
          node scripts/integrate-qr-barcode.cjs
          node scripts/install-tiktok-tool.cjs
          node scripts/install-adsense.cjs
          node scripts/install-ga4.cjs
          node scripts/check-adsense-readiness.cjs
          node scripts/audit-adsense-site-quality.cjs
          node scripts/test-ga4.cjs
          node scripts/test-tiktok-tool.cjs
          test -s reports/adsense-site-quality.json
          test -s reports/adsense-site-quality.md
          sed -n '1,115p' reports/adsense-site-quality.md
      - name: Preserve detailed SEO inventory as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docvelio-seo-page-inventory
          path: |
            seo-reports/
            reports/adsense-readiness.json
            reports/adsense-site-quality.json
            reports/adsense-site-quality.md
          if-no-files-found: warn
          retention-days: 21
