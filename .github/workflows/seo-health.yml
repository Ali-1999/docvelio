name: Docvelio SEO health audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/seo-health.yml'
permissions:
  contents: read
jobs:
  seo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build website and run existing SEO checks
        run: |
          node scripts/extend-toolkit.cjs
          node scripts/build-blogs.cjs
          node scripts/build-docvelio.cjs
          node scripts/site-shell.cjs
          node scripts/page-content.cjs
          node scripts/apply-design.cjs
          node scripts/seo-audit-fixes.cjs
          node scripts/add-image-studio.cjs
          node scripts/image-seo-pages.cjs
          node scripts/build-cargo-tools.cjs
          node scripts/ensure-yandex-verification.cjs
          node scripts/build-wheel-picker.cjs
          node scripts/final-global-shell.cjs
          node scripts/optimize-site.cjs
          node scripts/seo-growth.cjs
          node scripts/add-search-answers.cjs
          node scripts/audit-seo-final.cjs
          node scripts/audit-seo.cjs
          node scripts/build-excel-formula.cjs
          node scripts/build-europe-tools.cjs
          node scripts/redesign-home-toolkit.cjs
          node scripts/redesign-full-homepage.cjs
          node scripts/ensure-organization-schema.cjs
          node scripts/fix-ahrefs-metadata.cjs
          node scripts/refresh-guide-descriptions.cjs
          node scripts/install-adsense.cjs
          node scripts/implement-internal-links.cjs
          node scripts/install-fazier-badge.cjs
          node scripts/optimize-homepage-css.cjs
          node scripts/integrate-qr-barcode.cjs
          node scripts/install-ga4.cjs
          node scripts/check-adsense-readiness.cjs
          node scripts/audit-adsense-site-quality.cjs
      - name: Check localized guide metadata
        run: |
          node --check scripts/refresh-guide-descriptions.cjs
          node --check scripts/test-guide-descriptions.cjs
          node scripts/test-guide-descriptions.cjs
      - name: Verify AdSense preflight and Google consent order
        run: |
          node --check scripts/install-adsense.cjs
          node --check scripts/install-ga4.cjs
          node --check scripts/check-adsense-readiness.cjs
          node scripts/test-ga4.cjs
          node scripts/check-adsense-readiness.cjs
      - name: Validate full site-quality and content inventory
        run: |
          node --check scripts/audit-adsense-site-quality.cjs
          node scripts/audit-adsense-site-quality.cjs
          test -s reports/adsense-site-quality.json
          test -s reports/adsense-site-quality.md
      - name: Verify Excel formula generator source and build integration
        shell: bash
        run: |
          set -euo pipefail
          node --check src/excel-formula-worker.js
          node --check scripts/build-excel-formula.cjs
          node --check public/assets/excel-formula-generator.js
          node scripts/test-excel-formula.cjs
          test -s public/excel-formula-generator/index.html
          grep -Fq 'href="https://docvelio.com/excel-formula-generator/"' public/excel-formula-generator/index.html
          grep -Fq '<loc>https://docvelio.com/excel-formula-generator/</loc>' public/sitemap.xml
          grep -Fq '/api/excel-formula' public/assets/excel-formula-generator.js
          grep -Fq 'main' wrangler.jsonc
          echo 'Excel Formula Generator page, sitemap and endpoint source verified'
      - name: Verify redesigned homepage tools and responsive UI
        run: |
          node --check scripts/redesign-home-toolkit.cjs
          node --check public/assets/site.js
          node scripts/test-home-toolkit.cjs
          node --check scripts/redesign-full-homepage.cjs
          node scripts/test-full-homepage.cjs
          node --check scripts/optimize-homepage-css.cjs
          node scripts/test-homepage-performance.cjs
      - name: Verify five European utility tools and payment QR logic
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-europe-tools.cjs
          node --check scripts/test-europe-tools.cjs
          node --check public/assets/europe-tools-core.js
          node --check public/assets/europe-tools-ui.js
          node --check public/assets/docvelio-qr.js
          node scripts/test-europe-tools.cjs
      - name: Validate contextual internal linking map
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/implement-internal-links.cjs
          node --check scripts/test-internal-links.cjs
          node scripts/test-internal-links.cjs
      - name: Verify Fazier launch badge in all footers
        run: |
          node --check scripts/install-fazier-badge.cjs
          node --check scripts/test-fazier-badge.cjs
          node scripts/test-fazier-badge.cjs
      - name: Check rendered HTML and image SEO
        run: node scripts/seo-health-check.cjs
      # Live domain, Cloudflare WAF, and deploy checks are intentionally tracked by
      # the independent live-indexability and deploy-cloudflare workflows.
      # Source quality failures remain fatal here; no live errors are suppressed.
      - name: Upload AdSense review and page-level content reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docvelio-adsense-quality-reports
          path: |
            reports/adsense-readiness.json
            reports/adsense-site-quality.json
            reports/adsense-site-quality.md
          if-no-files-found: warn
          retention-days: 21
