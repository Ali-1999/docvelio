name: Docvelio SEO health audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: read
jobs:
  seo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website and run existing SEO checks
        run: |
          node scripts/extend-toolkit.cjs
          node scripts/build-blogs.cjs
          node scripts/build-docvelio.cjs
          node scripts/site-shell.cjs
          node scripts/page-content.cjs
          node scripts/apply-design.cjs
          node scripts/seo-audit-fixes.cjs
          node scripts/add-image-studio.cjs
          node scripts/image-seo-pages.cjs
          node scripts/build-cargo-tools.cjs
          node scripts/ensure-yandex-verification.cjs
          node scripts/build-wheel-picker.cjs
          node scripts/final-global-shell.cjs
          node scripts/optimize-site.cjs
          node scripts/seo-growth.cjs
          node scripts/add-search-answers.cjs
          node scripts/audit-seo-final.cjs
          node scripts/audit-seo.cjs
      - name: Check rendered HTML and image SEO
        run: node scripts/seo-health-check.cjs
