name: Deploy Docvelio to Cloudflare Workers

on:
  push:
    branches: [main]
    # Documentation-only commits do not require another production deployment.
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: docvelio-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Confirm required Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare deploy credentials available."
      - name: Verify Worker source syntax and public-video helper
        run: |
          node --check src/excel-formula-worker.js
          node --check src/tiktok-worker-free.js
          node scripts/test-tiktok-worker-free.cjs
      - name: Deploy Worker and generated assets to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Check live TikTok page and same-origin status endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking production URL..."
          for attempt in 1 2 3 4 5; do
            page="$(curl -sSL --connect-timeout 10 --max-time 25 -o /tmp/docvelio-tiktok-page -w '%{http_code}' 'https://docvelio.com/tools/tiktok-video-downloader/' || true)"
            status="$(curl -sSL --connect-timeout 10 --max-time 25 -o /tmp/docvelio-tiktok-api -w '%{http_code}' 'https://docvelio.com/api/tiktok/status' || true)"
            if [[ "$page" == "200" && "$status" == "200" ]] && grep -q 'id="tk-link-download"' /tmp/docvelio-tiktok-page && grep -q '"available"' /tmp/docvelio-tiktok-api; then
              echo "Live Docvelio TikTok page and API responded successfully."
              cat /tmp/docvelio-tiktok-api
              exit 0
            fi
            echo "Attempt $attempt: page HTTP $page, API HTTP $status (Cloudflare challenge or DNS propagation may affect result)."
            sleep 6
          done
          echo "::error::Live page and API verification failed. Review Cloudflare routing/WAF and assigned domain."
          exit 1
