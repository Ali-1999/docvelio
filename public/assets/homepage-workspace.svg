<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">Illustration of PDF, image and spreadsheet tools</title><desc id="desc">A stylized desktop workspace showing a PDF editor beside an image and Excel formula panel. This is an illustration, not an actual product screenshot.</desc>
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8F2FF"/><stop offset="1" stop-color="#F4F0FF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3276EF"/><stop offset="1" stop-color="#5E60E8"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#40C4B4"/><stop offset="1" stop-color="#11998E"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white"/><stop offset="1" stop-color="#F8FAFF"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#173A7D" flood-opacity=".15"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#213866" flood-opacity=".12"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#9DB7E3" opacity=".33"/></pattern>
</defs>
